[build-system]
requires = [
    "meson-python >= 0.13",
]
build-backend = "mesonpy"

[project]
name = "ppm2"
version = "0.0.0"
dependencies = [
    "cyclopts",
    "attrs",
    "cattrs",
]

[project.scripts]

immers2 = "ppm2.immers_exe:main"
ppm2 = "ppm2.cli:app"

[dependency-groups]

dev = [
    "pdbpp",
    "ipython",
]

test = [
    "pytest",
]

[tool.uv]
default-groups = ["dev", "test"]
