[build-system]
requires = [
    "meson-python >= 0.13",
]
build-backend = "mesonpy"


[project]
name = "ppm2"
version = "0.0.0"
dependencies = [
    "cyclopts",
    "attrs",
    "cattrs",
]

readme = "README.md"

description = "PPM Python: Positioning of Proteins in Membranes Python Wrapper"


authors = [
# { name = "BioMembHub Team", website = "https://biomembhub.org/" },
{ name = "Andrei Lomize", email = "lomizeal@gmail.com" },
{ name = "Wonpil Im", email = "wonpil@lehigh.edu" },
{ name = "Samuel Lotz", email = "samuel.lotz@salotz.info" }
]

maintainers = [
{ name = "Samuel Lotz", email = "samuel.lotz@salotz.info" }
]

license = "GPL-3.0-only"
license-files = ["license.txt"]


keywords = ["ppm", "ppm2", "opm", "membrane proteins", "science", "positioning of proteins in membranes"]

[project.urls]
homepage = "https://github.com/examol-corp/ppm-python"
source = "https://github.com/examol-corp/ppm-python"

[project.scripts]

immers2 = "ppm2.immers_exe:main"
ppm2 = "ppm2.cli:app"

[dependency-groups]

dev = [
    "pdbpp",
    "ipython",
]

test = [
    "pytest",
]

[tool.uv]
default-groups = ["dev", "test"]
